# Local SaaS stack: API, Celery media worker/Beat, Postgres, Redis, and MinIO.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: breakpoint
      POSTGRES_PASSWORD: breakpoint
      POSTGRES_DB: breakpoint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakpoint"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-10-13T08-57-13Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/breakpoint-videos &&
      mc cors set local/breakpoint-videos /config/minio-cors.xml
      "
    volumes:
      - ./minio-cors.xml:/config/minio-cors.xml:ro

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  api:
    build:
      context: ..
      dockerfile: web/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      BREAKPOINT_ENVIRONMENT: production
      BREAKPOINT_DATABASE_URL: postgresql+psycopg2://breakpoint:breakpoint@postgres:5432/breakpoint
      BREAKPOINT_JWT_SECRET_KEY: ${BREAKPOINT_JWT_SECRET_KEY:?set a strong JWT secret for the api container}
      BREAKPOINT_REFRESH_COOKIE_SECURE: ${BREAKPOINT_REFRESH_COOKIE_SECURE:-false}
      BREAKPOINT_CORS_ALLOW_ORIGINS: ${BREAKPOINT_CORS_ALLOW_ORIGINS:-http://localhost:3000}
      BREAKPOINT_APP_BASE_URL: ${BREAKPOINT_APP_BASE_URL:-http://localhost:3000}
      BREAKPOINT_SMTP_HOST: mailpit
      BREAKPOINT_SMTP_PORT: "1025"
      BREAKPOINT_SMTP_USE_TLS: "false"
      BREAKPOINT_SMTP_FROM_ADDRESS: no-reply@breakpoint.local
      BREAKPOINT_S3_ENDPOINT_URL: http://minio:9000
      BREAKPOINT_S3_BROWSER_ENDPOINT_URL: ${BREAKPOINT_S3_BROWSER_ENDPOINT_URL:-http://localhost:9000}
      BREAKPOINT_S3_ACCESS_KEY: minioadmin
      BREAKPOINT_S3_SECRET_KEY: minioadmin
      BREAKPOINT_S3_BUCKET: breakpoint-videos
      BREAKPOINT_S3_REGION: us-east-1
      BREAKPOINT_S3_USE_PATH_STYLE: "true"
      BREAKPOINT_UPLOAD_PART_PRESIGNED_URL_TTL_SECONDS: "86400"
      BREAKPOINT_REDIS_URL: redis://redis:6379/0
      BREAKPOINT_TASK_DISPATCH_ENABLED: "true"

  frontend:
    build:
      context: ..
      dockerfile: web/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

  worker:
    build:
      context: ..
      dockerfile: web/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    healthcheck:
      disable: true
    environment:
      BREAKPOINT_ENVIRONMENT: production
      BREAKPOINT_RUN_MIGRATIONS: "false"
      BREAKPOINT_DATABASE_URL: postgresql+psycopg2://breakpoint:breakpoint@postgres:5432/breakpoint
      BREAKPOINT_JWT_SECRET_KEY: ${BREAKPOINT_JWT_SECRET_KEY:?set a strong JWT secret}
      BREAKPOINT_REDIS_URL: redis://redis:6379/0
      BREAKPOINT_S3_ENDPOINT_URL: http://minio:9000
      BREAKPOINT_S3_ACCESS_KEY: minioadmin
      BREAKPOINT_S3_SECRET_KEY: minioadmin
      BREAKPOINT_S3_BUCKET: breakpoint-videos
      BREAKPOINT_S3_REGION: us-east-1
      BREAKPOINT_S3_USE_PATH_STYLE: "true"

  beat:
    build:
      context: ..
      dockerfile: web/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO"]
    healthcheck:
      disable: true
    environment:
      BREAKPOINT_ENVIRONMENT: production
      BREAKPOINT_RUN_MIGRATIONS: "false"
      BREAKPOINT_DATABASE_URL: postgresql+psycopg2://breakpoint:breakpoint@postgres:5432/breakpoint
      BREAKPOINT_JWT_SECRET_KEY: ${BREAKPOINT_JWT_SECRET_KEY:?set a strong JWT secret}
      BREAKPOINT_REDIS_URL: redis://redis:6379/0
      BREAKPOINT_S3_ENDPOINT_URL: http://minio:9000
      BREAKPOINT_S3_ACCESS_KEY: minioadmin
      BREAKPOINT_S3_SECRET_KEY: minioadmin
      BREAKPOINT_S3_BUCKET: breakpoint-videos
      BREAKPOINT_S3_REGION: us-east-1
      BREAKPOINT_S3_USE_PATH_STYLE: "true"

volumes:
  postgres_data:
  minio_data:
